<!DOCTYPE html>
<html lang="en" data-lang="en" data-root="../" data-title-en="Gallery — Bowen Su" data-title-zh="相册 — Bowen Su">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Bowen Su</title>
  <meta name="description" content="Photos by Bowen Su.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230a0c0d'/><text x='50%25' y='56%25' text-anchor='middle' dominant-baseline='middle' font-family='Georgia,serif' font-style='italic' font-size='32' fill='%234fd1b9'>BS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add("js");
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
        var q = /[?&]lang=(zh|en)\b/.exec(location.search);
        var l = q ? q[1] : localStorage.getItem("lang");
        if (!l) l = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
        if (l === "zh") { d.setAttribute("data-lang", "zh"); d.lang = "zh-CN"; }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="progress" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a class="brand" href="../" aria-label="Home"><span>B</span><i>S</i></a>
    <nav class="nav-links sub" aria-label="Pages">
      <a href="../"><span class="en">Home</span><span class="zh" lang="zh-CN">主页</span></a>
      <a href="../blog/"><span class="en">Blog</span><span class="zh" lang="zh-CN">博客</span></a>
      <a href="../gallery/" aria-current="page"><span class="en">Gallery</span><span class="zh" lang="zh-CN">相册</span></a>
    </nav>
    <div class="nav-actions">
      <button class="kbd-btn" id="palette-open" type="button" aria-label="Open command menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <span class="kbd-hint"><kbd>⌘</kbd><kbd>K</kbd></span>
      </button>
      <button class="lang-switch" id="lang-toggle" type="button" aria-label="Switch language / 切换语言">
        <span class="opt opt-en">EN</span><span class="opt opt-zh">中</span><span class="thumb" aria-hidden="true"></span>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
      </button>
    </div>
  </header>

  <main class="page">
    <div class="wrap">
      <header class="page-head">
        <p class="eyebrow mono"><span class="dot"></span><span class="en">Photography</span><span class="zh" lang="zh-CN">摄影</span></p>
        <h1 class="page-title"><span class="en">The <em>Gallery</em></span><span class="zh" lang="zh-CN"><em>相册</em></span></h1>
        <p class="page-sub">
          <span class="en">Places, people and light I want to remember.</span>
          <span class="zh" lang="zh-CN">记录走过的地方、遇见的人和光。</span>
        </p>
      </header>
      <div class="tag-row" id="albums" hidden></div>
      <div class="justified" id="grid" aria-live="polite"></div>
      <p class="state-msg" id="state" hidden></p>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">
      <figcaption>
        <span id="lb-cap"></span>
        <span class="lb-loc" id="lb-loc" hidden></span>
        <span class="mono" id="lb-meta"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next photo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <span class="lb-count mono" id="lb-count"></span>
  </div>

  <footer class="footer">
    <div class="wrap">
      <span>© <span id="year">2026</span> Bowen Su</span>
      <span class="mono">
        <span class="en">Press <kbd>⌘</kbd><kbd>K</kbd> to navigate</span>
        <span class="zh" lang="zh-CN">按 <kbd>⌘</kbd><kbd>K</kbd> 快速导航</span>
      </span>
    </div>
  </footer>

  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Command menu" hidden>
    <div class="palette-backdrop" data-close></div>
    <div class="palette-panel">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
        <input id="palette-q" type="text" autocomplete="off" spellcheck="false" aria-label="Search">
        <kbd class="mono">esc</kbd>
      </div>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
    </div>
  </div>

  <div class="toast mono" id="toast" role="status" aria-live="polite"></div>

  <script src="../main.js"></script>
  <script src="../assets/gallery.js"></script>
</body>
</html>
