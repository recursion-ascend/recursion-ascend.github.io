<!DOCTYPE html>
<html lang="en" data-lang="en" data-root="../" data-title-en="Gallery — Bowen Su" data-title-zh="相册 — Bowen Su">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Bowen Su</title>
  <meta name="description" content="Photos by Bowen Su.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23fbf8f1'/><text x='10' y='46' font-family='Georgia,serif' font-style='italic' font-size='40' fill='%23c0392b'>∑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Long+Cang&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var qt = /[?&]theme=(light|dark)\b/.exec(location.search);
        var t = qt ? qt[1] : localStorage.getItem("theme");
        if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
        var q = /[?&]lang=(zh|en)\b/.exec(location.search);
        var l = q ? q[1] : localStorage.getItem("lang");
        if (!l) l = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
        if (l === "zh") { d.setAttribute("data-lang", "zh"); d.lang = "zh-CN"; }
      } catch (e) {}
    })();
  </script>
</head>
<body>
<div class="sheet">

  <div class="row">
    <div></div>
    <nav class="topbar" aria-label="Site">
      <span class="tabs"><a href="../"><span class="en">home</span><span class="zh">主页</span></a><span class="sep">·</span><a href="../blog/"><span class="en">blog</span><span class="zh">博客</span></a><span class="sep">·</span><a href="../gallery/" aria-current="page"><span class="en">gallery</span><span class="zh">相册</span></a><span class="sep">·</span><a href="../cv.pdf"><span class="en">cv</span><span class="zh">简历</span></a></span>
      <span class="ctl">
        <button type="button" data-toggle-lang><span class="en">中文</span><span class="zh">English</span></button>
        <button type="button" data-toggle-theme><span data-when="light"><span class="en">lights off ☾</span><span class="zh">关灯 ☾</span></span><span data-when="dark"><span class="en">lights on ☀</span><span class="zh">开灯 ☀</span></span></button>
      </span>
    </nav>
    <div></div>
  </div>

  <main>
    <section class="row" style="margin-top:0">
      <div class="num"></div>
      <div>
        <h1 class="page-title"><span class="en">Gallery</span><span class="zh">相册</span></h1>
        <div class="tag-row" id="albums" hidden></div>
      </div>
      <div class="note pencil"><span class="en">click a photo to enlarge</span><span class="zh">点照片可以放大</span></div>
    </section>
    <div class="row">
      <div></div>
      <div class="wide">
        <div class="justified" id="grid" aria-live="polite"></div>
        <p class="state-msg" id="state" hidden></p>
      </div>
    </div>
  </main>

  <footer class="row">
    <div></div>
    <div>
      <p class="sign">
        <span class="en">write to me:</span><span class="zh">来信：</span>
        <a href="mailto:subowen@msu.edu">subowen@msu.edu</a><button class="copy copy-email" type="button"><span class="en">(copy)</span><span class="zh">（复制）</span></button>
        · <a href="https://github.com/recursion-ascend">github</a>
      </p>
      <p class="updated"><span class="en">last edited</span><span class="zh">最后修改</span> <span id="updated"></span></p>
    </div>
    <div></div>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close">✕</button>
  <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous photo">←</button>
  <figure class="lb-figure">
    <img id="lb-img" alt="">
    <figcaption>
      <span id="lb-cap"></span>
      <span class="lb-loc" id="lb-loc" hidden></span>
      <span class="mono" id="lb-meta"></span>
    </figcaption>
  </figure>
  <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next photo">→</button>
  <span class="lb-count" id="lb-count"></span>
</div>
<script src="../main.js"></script>
<script src="../assets/gallery.js"></script>
</body>
</html>
